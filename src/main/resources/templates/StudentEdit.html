<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${student.id == null ? 'Dodaj studenta' : 'Edytuj studenta'}"></title>
  <link rel="stylesheet" th:href="@{/edit-style.css}" />
</head>
<body>
<div class="container">
  <h1 th:text="${student.id == null ? 'Dodaj nowego studenta' : 'Edytuj studenta'}"></h1>

  <form th:action="@{/studenci/zapisz}" th:object="${student}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
      <label for="imie">Imię:</label>
      <input type="text" id="imie" th:field="*{imie}" required />
    </div>

    <div class="form-group">
      <label for="nazwisko">Nazwisko:</label>
      <input type="text" id="nazwisko" th:field="*{nazwisko}" required />
    </div>

    <div class="form-group">
      <label for="nrIndeksu">Numer indeksu:</label>
      <input type="text" id="nrIndeksu" th:field="*{nrIndeksu}" required />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" th:field="*{email}" />
    </div>

    <div class="form-group">
      <label for="stacjonarny">Typ studiów:</label>
      <select id="stacjonarny" th:field="*{stacjonarny}">
        <option value="true">Stacjonarne</option>
        <option value="false">Niestacjonarne</option>
      </select>
    </div>

    <div class="buttons">
      <button type="submit" class="btn save-btn">Zapisz</button>
      <a th:href="@{/studenci}" class="btn cancel-btn">Anuluj</a>
    </div>
  </form>
</div>
</body>
</html>
